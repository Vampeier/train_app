<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEB - Anschlusszüge</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <!-- PWA Manifest Verknüpfung -->
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col overflow-hidden select-none">

    <!-- Horizontale Top-Bar -->
    <header class="bg-slate-800/95 backdrop-blur-md border-b border-slate-700/80 px-2 py-1.5 shrink-0 shadow-md">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar whitespace-nowrap">
            
            <!-- Vollbild & Plus -->
            <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-700/70 px-2 py-1 rounded-lg shrink-0 text-xs">
                <button type="button" onclick="toggleFullscreen()" class="text-slate-400 hover:text-white transition" title="Vollbild">
                    <span id="fullscreen-icon">⛶</span>
                </button>
                <div class="h-3.5 w-[1px] bg-slate-700"></div>
                <button type="button" onclick="openAddModal()" class="text-green-400 hover:text-green-300 font-bold transition flex items-center gap-0.5" title="Züge / Schichten hinzufügen">
                    <span>➕</span>
                </button>
            </div>

            <!-- Datumsauswahl -->
            <div class="flex items-center shrink-0">
                <input type="date" id="datePicker" onchange="onDateChange()" 
                       class="bg-slate-900 border border-slate-700 text-white text-xs rounded-lg px-1.5 py-1 focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <!-- Zug-Auswahl als Pulldown-Menü -->
            <div id="trainSelectContainer" class="flex items-center gap-1 shrink-0 hidden">
                <select id="trainSelect" onchange="selectTrain(this.value)" 
                        class="bg-slate-900 border border-slate-700 text-blue-400 font-mono font-bold text-xs rounded-lg px-2 py-1 focus:outline-none focus:border-blue-500 max-w-[200px] truncate">
                    <!-- Dynamisch befüllt -->
                </select>
                <button type="button" onclick="deleteActiveTrain()" title="Aktuellen Zug löschen" 
                        class="bg-slate-900 border border-slate-700 text-slate-400 hover:text-red-400 px-2 py-1 rounded-lg text-xs transition">
                    ✕
                </button>
            </div>

            <!-- Externer Link -->
            <a id="externalLink" href="#" target="_blank" class="text-xs bg-slate-900 border border-slate-700 text-blue-400 hover:text-blue-300 px-2 py-1 rounded-lg shrink-0 hidden" title="Auf bahn.expert öffnen">
                ↗
            </a>

        </div>
    </header>

    <!-- iFrame -->
    <main class="flex-1 w-full h-full relative bg-slate-950">
        <iframe 
            id="bahnIframe" 
            src="" 
            class="w-full h-full border-0 hidden" 
            loading="lazy"
            title="bahn.expert Details">
        </iframe>
    </main>

    <!-- Modal für Übersicht & Getrennte Eingabe -->
    <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-4 shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                    <span>🚆</span> Züge / Schichten verwalten
                </h3>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-white text-xs px-1">✕</button>
            </div>

            <!-- Vorhandene Züge Tabelle -->
            <div id="modalTrainTableContainer" class="max-h-36 overflow-y-auto no-scrollbar rounded-lg border border-slate-800 bg-slate-950/50 p-2 text-xs">
                <table class="w-full text-left font-mono">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800 text-[11px]">
                            <th class="pb-1">Zug</th>
                            <th class="pb-1 text-center">Strecke</th>
                            <th class="pb-1 text-right">Zeit</th>
                            <th class="pb-1 w-6"></th>
                        </tr>
                    </thead>
                    <tbody id="modalTrainTableBody" class="divide-y divide-slate-800/50">
                        <!-- Dynamisch befüllt -->
                    </tbody>
                </table>
                <div id="modalEmptyHint" class="text-center text-slate-500 text-[11px] py-2 hidden">
                    Noch keine Züge eingetragen.
                </div>
            </div>
            
            <!-- Getrennte Eingabefelder -->
            <div class="space-y-2">
                <div>
                    <label class="text-[11px] text-slate-400 block font-semibold mb-0.5">
                        Schichtnummer(n):
                    </label>
                    <input type="text" id="modalShiftInput" placeholder="z.B. 52002, 52005"
                           class="w-full bg-slate-950 border border-slate-700 text-white placeholder-slate-600 text-xs rounded-lg p-2 focus:outline-none focus:border-blue-500 font-mono">
                </div>

                <div>
                    <label class="text-[11px] text-slate-400 block font-semibold mb-0.5">
                        Einzelne Zugnummer(n):
                    </label>
                    <input type="text" id="modalTrainInput" placeholder="z.B. 55693, 55698"
                           class="w-full bg-slate-950 border border-slate-700 text-white placeholder-slate-600 text-xs rounded-lg p-2 focus:outline-none focus:border-blue-500 font-mono">
                </div>
            </div>

            <div class="flex justify-between items-center pt-1">
                <span id="loadedJsonStatus" class="text-[10px] text-slate-500 font-mono truncate max-w-[180px]"></span>
                <div class="flex gap-2">
                    <button type="button" onclick="closeAddModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                        Schließen
                    </button>
                    <button type="button" id="submitBtn" onclick="submitMultipleInputs()" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg transition">
                        Hinzufügen
                    </button>
                </div>
            </div>
        </div>
    </div>

    let activeDate = new Date().toISOString().split('T')[0];
    document.getElementById('datePicker').value = activeDate;

    function checkDataLoaded() {
        const statusEl = document.getElementById('loadedJsonStatus');
        if (typeof shiftData !== 'undefined') {
            if (statusEl) statusEl.innerText = 'DB: Integriert (Aktiv)';
        } else {
            if (statusEl) statusEl.innerText = 'Fehler: DB fehlt!';
        }
    }

    function getStoredData() {
        return JSON.parse(localStorage.getItem('neb_train_data_v5') || '{}');
    }

    function saveStoredData(data) {
        localStorage.setItem('neb_train_data_v5', JSON.stringify(data));
    }

    function getSortedTrainsForActiveDate() {
        const data = getStoredData();
        let trains = data[activeDate] || [];

        trains.sort((a, b) => {
            if (!a.depTime) return 1;
            if (!b.depTime) return -1;
            return a.depTime.localeCompare(b.depTime);
        });

        return trains;
    }

    function onDateChange() {
        activeDate = document.getElementById('datePicker').value;
        renderTrains();
    }

    function openAddModal() {
        document.getElementById('addModal').classList.remove('hidden');
        checkDataLoaded();
        renderModalTable();
        document.getElementById('modalShiftInput').value = '';
        document.getElementById('modalTrainInput').value = '';
        setTimeout(() => document.getElementById('modalShiftInput').focus(), 100);
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
    }

    function formatTrainName(num) {
        return /^\d+$/.test(num) ? 'NEB ' + num : num;
    }

    function parseRoute(streckeStr) {
        if (!streckeStr) return { originAbbr: '?', destAbbr: '?' };
        const parts = streckeStr.split('-').map(s => s.trim());
        return {
            originAbbr: parts[0] || '?',
            destAbbr: parts[1] || '?'
        };
    }

    function getTrainDetailsFromLocal(trainNum) {
        const cleanTrainNum = String(trainNum).trim();
        let originAbbr = '?';
        let destAbbr = '?';
        let depTime = null;
        let arrTime = null;

        if (typeof shiftData !== 'undefined' && shiftData.schichten) {
            for (const schicht of shiftData.schichten) {
                const leistung = schicht.leistungen.find(l => String(l.zugnummer).trim() === cleanTrainNum);
                if (leistung) {
                    const route = parseRoute(leistung.strecke);
                    originAbbr = route.originAbbr;
                    destAbbr = route.destAbbr;
                    depTime = leistung.von;
                    arrTime = leistung.bis;
                    break;
                }
            }
        }

        if (!depTime && typeof shiftData !== 'undefined' && shiftData.zugzeiten && shiftData.zugzeiten[cleanTrainNum]) {
            const zData = shiftData.zugzeiten[cleanTrainNum];
            const firstKey = Object.keys(zData)[0];
            if (firstKey) {
                const info = zData[firstKey];
                depTime = info.W_ab || info.E_ab || info.F_ab || null;
                arrTime = info.F_an || info.E_an || info.W_an || null;
            }
        }

        return {
            num: cleanTrainNum,
            lineName: formatTrainName(cleanTrainNum),
            originAbbr: originAbbr,
            destAbbr: destAbbr,
            depTime: depTime,
            arrTime: arrTime
        };
    }

    function renderModalTable() {
        const trains = getSortedTrainsForActiveDate();
        const tbody = document.getElementById('modalTrainTableBody');
        const emptyHint = document.getElementById('modalEmptyHint');

        tbody.innerHTML = '';

        if (trains.length === 0) {
            emptyHint.classList.remove('hidden');
            return;
        }

        emptyHint.classList.add('hidden');

        trains.forEach(t => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-800/40 text-slate-200";

            const dep = t.depTime || '--:--';
            const arr = t.arrTime || '--:--';
            const route = `${t.originAbbr || '?'} - ${t.destAbbr || '?'}`;

            tr.innerHTML = `
                <td class="py-1 font-bold text-slate-100">${t.num}</td>
                <td class="py-1 text-center text-slate-400">${route}</td>
                <td class="py-1 text-right text-blue-400">${dep} - ${arr}</td>
                <td class="py-1 text-right">
                    <button onclick="deleteTrain('${t.num}')" class="text-slate-500 hover:text-red-400 px-1">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function submitMultipleInputs() {
        const shiftText = document.getElementById('modalShiftInput').value.trim();
        const trainText = document.getElementById('modalTrainInput').value.trim();

        if (!shiftText && !trainText) return;

        const data = getStoredData();
        if (!data[activeDate]) data[activeDate] = [];

        const trainsToAdd = [];

        if (shiftText && typeof shiftData !== 'undefined') {
            const shifts = shiftText.split(/[\s,;\n]+/).map(s => s.trim()).filter(Boolean);
            shifts.forEach(shiftNum => {
                const matchedShift = shiftData.schichten ? shiftData.schichten.find(s => String(s.schichtnummer).trim() === shiftNum) : null;
                
                if (matchedShift && matchedShift.leistungen) {
                    matchedShift.leistungen.forEach(l => {
                        const route = parseRoute(l.strecke);
                        trainsToAdd.push({
                            num: String(l.zugnummer).trim(),
                            lineName: formatTrainName(l.zugnummer),
                            originAbbr: route.originAbbr,
                            destAbbr: route.destAbbr,
                            depTime: l.von,
                            arrTime: l.bis
                        });
                    });
                }
            });
        }

        if (trainText) {
            const trains = trainText.split(/[\s,;\n]+/).map(t => t.trim()).filter(Boolean);
            trains.forEach(trainNum => {
                trainsToAdd.push(getTrainDetailsFromLocal(trainNum));
            });
        }

        trainsToAdd.forEach(details => {
            const existingIndex = data[activeDate].findIndex(t => t.num === details.num);
            if (existingIndex !== -1) {
                data[activeDate][existingIndex] = details;
            } else {
                data[activeDate].push(details);
            }
        });

        saveStoredData(data);
        document.getElementById('modalShiftInput').value = '';
        document.getElementById('modalTrainInput').value = '';

        renderTrains();
        renderModalTable();
    }

    function deleteTrain(trainNum) {
        const data = getStoredData();
        if (data[activeDate]) {
            data[activeDate] = data[activeDate].filter(t => String(t.num) !== String(trainNum));
            if (data[activeDate].length === 0) delete data[activeDate];
            saveStoredData(data);
        }
        renderTrains();
        renderModalTable();
    }

    function deleteActiveTrain() {
        const select = document.getElementById('trainSelect');
        if (select && select.value) {
            deleteTrain(select.value);
        }
    }

    function selectTrain(trainNum) {
        if (!trainNum) return;

        const formatted = formatTrainName(trainNum);
        const url = "https://bahn.expert/details/" + encodeURIComponent(formatted);

        const iframe = document.getElementById('bahnIframe');
        const externalLink = document.getElementById('externalLink');

        iframe.src = url;
        externalLink.href = url;

        const select = document.getElementById('trainSelect');
        if (select) select.value = String(trainNum);
    }

    function renderTrains() {
        const trains = getSortedTrainsForActiveDate();

        const trainContainer = document.getElementById('trainSelectContainer');
        const trainSelect = document.getElementById('trainSelect');
        const iframe = document.getElementById('bahnIframe');
        const externalLink = document.getElementById('externalLink');

        trainSelect.innerHTML = '';

        if (trains.length === 0) {
            iframe.classList.add('hidden');
            iframe.src = '';
            externalLink.classList.add('hidden');
            trainContainer.classList.add('hidden');
            return;
        }

        iframe.classList.remove('hidden');
        externalLink.classList.remove('hidden');
        trainContainer.classList.remove('hidden');
        
        trains.forEach((t) => {
            const timeStr = t.depTime || '--:--';
            const routeStr = `(${t.originAbbr || '?'}-${t.destAbbr || '?'})`;

            const option = document.createElement('option');
            option.value = t.num;
            option.textContent = `${timeStr} | ${t.num} ${routeStr}`;
            trainSelect.appendChild(option);
        });

        const now = new Date();
        const currentTimeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const isToday = activeDate === now.toISOString().split('T')[0];
        let targetTrain = trains[0].num;

        if (isToday) {
            const currentOrNext = trains.find(t => {
                if (!t.arrTime) return false;
                return t.arrTime >= currentTimeStr;
            });
            if (currentOrNext) targetTrain = currentOrNext.num;
        }

        selectTrain(targetTrain);
    }

    function toggleFullscreen() {
        const doc = document.documentElement;
        const icon = document.getElementById('fullscreen-icon');

        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            if (icon) icon.innerText = '🗗';
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            if (icon) icon.innerText = '⛶';
        }
    }

    renderTrains();
